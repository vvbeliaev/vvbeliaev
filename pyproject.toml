# Python side of the monorepo. The JS side is pnpm (`pnpm-workspace.yaml`,
# glob `apps/*`); this is its counterpart for the Python labs and apps.
#
# Membership is an explicit list, not a `labs/*` glob: the tier is polyglot by
# design, and uv requires every workspace member to carry a `pyproject.toml`.
# A glob would break the moment a JS or shell lab appears — which it did, on
# the first one. Adding a Python lab means adding a line here.
#
# Members share one lockfile and one resolution, which is what makes starting a
# Python lab free. The cost: `requires-python` is the intersection of every
# member, and members cannot hold conflicting pins. A lab that needs either —
# a CUDA-pinned torch, an older Python — comes out of this list and locks for
# itself.
[tool.uv.workspace]
members = [
  "apps/almanac",
  "labs/social-kit",
  "labs/backbone-check",
]
