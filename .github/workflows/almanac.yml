name: almanac

# Сборка образа вынесена в CI: сервер только тянет готовый образ из GHCR
# и никогда ничего не билдит. Образ публичный, как и репозиторий: в нём
# только код и общая схема, данные и секреты приходят на сервере.

on:
  push:
    branches: [main]
    paths:
      - 'apps/almanac/**'
      # Правка README или CLAUDE.md не пересобирает образ и не перезапускает сервер.
      - '!apps/almanac/*.md'
      # Сайт в образ пока не едет.
      - '!apps/almanac/web/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/almanac.yml'
  workflow_dispatch:

concurrency:
  group: almanac-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/almanac

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Сторонние действия закреплены хэшами коммитов: тег можно переставить, коммит нельзя.
      # Мажорные теги setup-uv не публикуются с v8 — нужна точная версия.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # Проверяем то, что поедет в образ: тот же Python (3.13) и ровно те версии из uv.lock.
      - run: uv run --locked --python 3.13 ruff check .
        working-directory: apps/almanac

      - run: uv run --locked --python 3.13 pytest -q
        working-directory: apps/almanac

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/almanac/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Coolify тянет свежий образ. Секреты репозитория: COOLIFY_URL,
      # COOLIFY_TOKEN, COOLIFY_ALMANAC_APP_UUID.
      - name: Trigger Coolify deployment
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=false"
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_ALMANAC_APP_UUID }}
