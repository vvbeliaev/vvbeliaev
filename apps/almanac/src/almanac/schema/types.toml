[types.people]
description = "A person: who they are, how the owner knows them, what matters about them"

[types.areas]
description = "A standing area of life or work: health, home, finances, a job"

[types.projects]
description = "A piece of work with an outcome: what is being done, why, where it stands"

[types.topics]
description = "A subject the owner keeps notes on: a technology, a book, a place"

[types.ideas]
description = "An idea or a plan that is not yet a commitment"

[types.principles]
description = "A principle the owner holds, drawn from their own experience: the claim, why, where it stops, its cases"

[types.boards]
description = "Principles gathered for one area, to look at and review together"
