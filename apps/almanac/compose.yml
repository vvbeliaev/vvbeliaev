# База almanac на своей машине. Только для локального запуска (`make up`): в бою база
# приходит адресом `DATABASE_URL`.
#
# Порт опубликован только на 127.0.0.1: из сети до базы не дотянуться. Но этого мало —
# другие контейнеры этой машины ходят на порты хоста, а среди них бывают и те, что
# открывают чужие страницы. Поэтому вход по паролю. Пароль рождается при первом `make up`
# и лежит в `.env` рядом (в git не попадает); оттуда же его читает compose.
#
# Имя проекта закреплено: том с данными один, из какой бы копии репозитория ни запускали.
name: almanac
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: almanac
      POSTGRES_DB: almanac
      # Действует только при первой инициализации тома. Пусто — образ откажется создавать базу.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports: ["127.0.0.1:5434:5432"]
    # С 18-й версии образ держит данные в /var/lib/postgresql/<версия>, том — на каталог выше.
    volumes: ["almanac-pg:/var/lib/postgresql"]
    restart: unless-stopped
volumes:
  almanac-pg:
