# База almanac на своей машине. Только для локального запуска (`make up`): в бою база
# приходит адресом `DATABASE_URL`.
#
# Входа по паролю нет (`trust`), и поэтому порт опубликован только на 127.0.0.1: до базы
# дотянется лишь процесс этой же машины. Пароль, записанный в публичном репозитории,
# защищал бы ровно так же, то есть никак, — и выглядел бы секретом.
#
# Имя проекта закреплено: том с данными один, из какой бы копии репозитория ни запускали.
name: almanac
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: almanac
      POSTGRES_DB: almanac
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["127.0.0.1:5434:5432"]
    # С 18-й версии образ держит данные в /var/lib/postgresql/<версия>, том — на каталог выше.
    volumes: ["almanac-pg:/var/lib/postgresql"]
    restart: unless-stopped
volumes:
  almanac-pg:
