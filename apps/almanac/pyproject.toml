[project]
name = "almanac"
version = "0.1.0"
description = "Personal source of truth: facts, pages, tasks and events behind an MCP door"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-dateutil>=2.9",
  # В slim-образе системной базы поясов нет, zoneinfo берёт её отсюда.
  "tzdata>=2024.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/almanac"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint.isort]
# Модули вроде almanac.app появятся в следующих задачах; сортировка не должна зависеть от того, есть ли файл.
known-first-party = ["almanac"]
