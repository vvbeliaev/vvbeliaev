[project]
name = "almanac"
version = "0.1.0"
description = "Personal source of truth: facts, pages, tasks and events behind an MCP door"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  # Драйвер Postgres. Синхронного драйвера в приложении нет: и сервер, и миграции идут на asyncpg.
  "asyncpg>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-dateutil>=2.9",
  # В slim-образе системной базы поясов нет, zoneinfo берёт её отсюда.
  "tzdata>=2024.2",
  # Разбор HTML-форм входа и согласия.
  "python-multipart>=0.0.12",
  # MCP-дверь. Extra code-mode тянет pydantic-monty: без него CodeMode падает на первом исполнении.
  "fastmcp[code-mode]>=4.0.5",
  # Собеседник в Telegram: агент на нашем же MCP в памяти процесса. Extra `mcp` тянет клиента fastmcp,
  # совместимого с нашим fastmcp 4; `google` — нативный провайдер Gemini.
  "pydantic-ai-slim[google,mcp]>=2.46,<3",
  # grep принимает выражение от модели; `re` не умеет прерываться по времени, `regex` умеет.
  "regex>=2024.11",
  # Клиент Bot API Telegram. Свой httpx, не httpx2 из fastmcp.
  "httpx>=0.27",
  # Календарная лента: события и задачи со сроком в iCalendar.
  "icalendar>=6.0",
  # Миграции: схему создаёт `alembic upgrade head`, не код приложения.
  "alembic>=1.14",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  # Запускает lifespan приложения в тестах HTTP-двери MCP.
  "asgi-lifespan>=2.1",
  # test_mcp.py импортирует httpx2 напрямую; без явной зависимости тест держится на транзитивной.
  "httpx2>=2",
  # Настоящий Postgres для тестов: образ postgres:18-alpine, один контейнер на прогон. Модуль
  # `testcontainers.community.postgres` есть с 4.15 (старый `testcontainers.postgres` объявлен устаревшим);
  # extra `postgres` не нужен: готовность контейнера проверяет psql внутри него.
  "testcontainers>=4.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/almanac"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint.isort]
# Модули вроде almanac.app появятся в следующих задачах; сортировка не должна зависеть от того, есть ли файл.
known-first-party = ["almanac"]
